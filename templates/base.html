<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}H5 商城接口回归 · 缺陷闭环{% endblock %}</title>
<style>
  :root {
    --bg: #f4f7fc; --surface: #fff; --ink: #16243c; --muted: #64748b;
    --line: #e2e9f3; --brand: #1677ff; --brand-soft: #eaf3ff;
    --green: #0f9d6e; --green-soft: #e6f7f0;
    --amber: #b26a00; --amber-soft: #fff4e0;
    --red: #d5443b; --red-soft: #fdeceb;
    --purple: #7048c8; --purple-soft: #f1ecff;
    --r: 12px; --r-sm: 8px;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    --mono: "SFMono-Regular", Consolas, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans);
    font-size: 14px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
  a { color: var(--brand); text-decoration: none; }
  .page { max-width: 1160px; margin: 0 auto; padding: 26px 20px 60px; }
  .hero { display: flex; gap: 20px; align-items: stretch; flex-wrap: wrap;
    background: linear-gradient(115deg, #1677ff 0%, #4d9bff 58%, #75b6ff 100%);
    border-radius: 16px; padding: 26px 30px; color: #fff; margin-bottom: 18px; }
  .hero-main { flex: 1; min-width: 280px; }
  .eyebrow { display: inline-block; font-size: 11.5px; letter-spacing: 1.4px;
    background: rgba(255,255,255,.18); padding: 3px 11px; border-radius: 999px; }
  .hero h1 { font-size: 25px; line-height: 1.4; margin: 12px 0 8px; font-weight: 600; }
  .hero p { margin: 0; font-size: 13.5px; opacity: .92; }
  .backend { flex: none; align-self: center; background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.28); border-radius: 12px;
    padding: 12px 16px; max-width: 320px; }
  .backend b { display: block; font-size: 13.5px; }
  .backend small { display: block; opacity: .88; font-size: 11.5px; margin-top: 4px; line-height: 1.5; }
  section { margin-bottom: 20px; }
  h2 { font-size: 16px; margin: 0 0 12px; font-weight: 600; }
  h2 .sub { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 8px; }
  .card { background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); padding: 20px 22px; min-width: 0; }
  .terms { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .term { background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); padding: 14px 16px; }
  .term b { font-size: 14px; }
  .term .en { font-family: var(--mono); font-size: 11px; color: var(--brand); margin-left: 6px; }
  .term p { margin: 5px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.65; }
  .action-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button { font-family: inherit; cursor: pointer; font-size: 13.5px; }
  .btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    padding: 9px 18px; border-radius: 9px; font-weight: 500; transition: .16s ease; }
  .btn:hover:not(:disabled) { border-color: var(--brand); color: var(--brand); transform: translateY(-1px); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: #0e63de; color: #fff; }
  .btn-warn { background: var(--amber-soft); border-color: #f2d9ad; color: var(--amber); }
  .btn-sm { padding: 6px 12px; font-size: 12.5px; }
  .hint { font-size: 12px; color: var(--muted); margin: 11px 0 0; }
  .stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .stat { background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); padding: 14px 16px; }
  .stat .n { font-size: 24px; font-weight: 600; line-height: 1.3; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 12px; color: var(--muted); }
  .stat.hl .n { color: var(--brand); }
  .stat.warn .n { color: var(--amber); }
  .stat.ok .n { color: var(--green); }
  .stat.bad .n { color: var(--red); }
  .grid-2 { display: grid; grid-template-columns: 1.25fr .75fr; gap: 16px; align-items: start; }
  .table-wrap { overflow-x: auto; max-width: 100%; }
  table { width: 100%; border-collapse: collapse; font-size: 12.8px; }
  th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--line);
    vertical-align: middle; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; background: #fafcff; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: none; }
  .mono { font-family: var(--mono); font-size: 11.8px; }
  .pill { display: inline-block; font-size: 11.5px; padding: 1px 9px;
    border-radius: 999px; line-height: 1.7; white-space: nowrap; }
  .pill.ok { background: var(--green-soft); color: var(--green); }
  .pill.warn { background: var(--amber-soft); color: var(--amber); }
  .pill.bad { background: var(--red-soft); color: var(--red); }
  .pill.muted { background: #f0f3f8; color: var(--muted); }
  .pill.dup { background: var(--purple-soft); color: var(--purple); }
  .empty { color: var(--muted); font-size: 13px; padding: 22px 0; text-align: center; }
  .steps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px;
    list-style: none; padding: 0; margin: 0; counter-reset: step; }
  .steps li { background: #fafcff; border: 1px solid var(--line); border-radius: 9px;
    padding: 12px 12px; font-size: 12.5px; }
  .steps li b { display: block; font-size: 13px; margin-bottom: 3px; }
  .steps li::before { counter-increment: step; content: counter(step);
    display: inline-flex; align-items: center; justify-content: center;
    width: 19px; height: 19px; border-radius: 50%; background: var(--brand-soft);
    color: var(--brand); font-size: 11px; margin-bottom: 6px; }
  .steps li span { color: var(--muted); font-size: 11.8px; line-height: 1.55; display: block; }
  .foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 26px; }

  /* ---- 项目 4 专用 ---- */
  .toast { border-radius: var(--r-sm); padding: 11px 16px; margin-bottom: 16px; font-size: 13.5px;
    background: var(--green-soft); color: #0b6e4f; border: 1px solid #bde8d5; }
  .toast.info { background: var(--brand-soft); color: var(--brand); border-color: #bcd9ff; }
  .toast.warn { background: var(--amber-soft); color: var(--amber); border-color: #f2d9ad; }
  .toast.hide { display: none; }
  .spinner { display: inline-block; width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.45); border-top-color: #fff;
    animation: spin .8s linear infinite; margin-right: 6px; vertical-align: -1px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .case-group { margin-bottom: 14px; }
  .case-group > b { display: block; font-size: 12.5px; color: var(--muted);
    font-weight: 500; margin-bottom: 6px; letter-spacing: .3px; }
  .case-row { display: flex; gap: 10px; align-items: center; padding: 7px 10px;
    border: 1px solid var(--line); border-radius: 8px; margin-bottom: 5px; background: var(--surface); }
  .case-row.fail { border-color: #f3c7c4; background: rgba(213,68,59,.04); }
  .case-row .name { flex: 1; min-width: 0; font-size: 12.6px; overflow-wrap: anywhere; }
  .case-row .dur { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .switch-row { display: flex; align-items: center; gap: 10px; padding: 9px 0;
    border-bottom: 1px solid var(--line); }
  .switch-row:last-child { border-bottom: none; }
  .switch-row .txt { flex: 1; min-width: 0; font-size: 12.5px; }
  .switch-row .txt small { display: block; color: var(--muted); font-size: 11px; }
  .sw { position: relative; width: 38px; height: 21px; flex: none; }
  .sw input { opacity: 0; width: 0; height: 0; }
  .sw i { position: absolute; inset: 0; border-radius: 99px; background: #cdd8e8;
    cursor: pointer; transition: .2s; }
  .sw i::after { content: ""; position: absolute; width: 15px; height: 15px; left: 3px; top: 3px;
    border-radius: 50%; background: #fff; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .sw input:checked + i { background: var(--red); }
  .sw input:checked + i::after { transform: translateX(17px); }
  .defect-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .defect-card { background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); padding: 16px 18px; min-width: 0; }
  .defect-card.found { border-color: #f3c7c4; }
  .defect-card h3 { font-size: 13.6px; margin: 0 0 8px; font-weight: 600; line-height: 1.55; }
  .defect-card .meta { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
  .defect-card dl { margin: 0; font-size: 12.3px; }
  .defect-card dt { color: var(--muted); font-size: 11.5px; margin-top: 8px; }
  .defect-card dd { margin: 2px 0 0; overflow-wrap: anywhere; }
  .defect-card ol { padding-left: 18px; margin: 2px 0 0; }
  .defect-card code { font-family: var(--mono); font-size: 11.5px;
    background: #f3f6fb; padding: 1px 5px; border-radius: 4px; }
  details summary { cursor: pointer; color: var(--brand); font-size: 12.3px; margin-top: 10px; }
  .timeline { max-height: 300px; overflow-y: auto; }
  .timeline td { font-size: 12px; }

  @media (max-width: 900px) {
    .terms, .grid-2, .defect-grid { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(3, 1fr); }
    .steps { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 520px) {
    .page { padding: 14px 12px 44px; }
    .hero { padding: 20px 18px; }
    .hero h1 { font-size: 20px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .card { padding: 16px 14px; }
    .btn { padding: 8px 13px; font-size: 13px; }
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121821; --surface: #1a2330; --ink: #e6edf7; --muted: #98a8bd;
      --line: #2b3746; --brand: #6aa8ff; --brand-soft: #1e314c;
      --green: #64d6ab; --green-soft: #1a3a30; --amber: #e9b567; --amber-soft: #3a2e18;
      --red: #f1948c; --red-soft: #3a2323; --purple: #b9a2f0; --purple-soft: #2c2440; }
    .btn-primary { background: #1677ff; border-color: #1677ff; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #0e63de; color: #fff; }
    .btn:not(.btn-primary) { color: var(--ink); }
    .term, .stat, .card, .steps li, th, .case-row, .defect-card { background: var(--surface); }
    .case-row.fail { background: rgba(241,148,140,.07); }
    .case-row.fail, .defect-card.found { border-color: #5c3535; }
    .pill.muted { background: #243040; color: #9aabc0; }
    .toast.info { color: #9cc6ff; }
    .defect-card code { background: #243040; }
    .sw i { background: #3b495c; }
  }
</style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
